[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "megax"
version = "0.0.1"
description = "Megatipovačka lineup optimizer — EV, crowd leverage, Monte Carlo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "cloudscraper25>=2.7.0",
    "fake-useragent>=2.0.0",
    "fastapi>=0.115.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "user-agents>=2.2.0",
    "uvicorn>=0.32.0",
]

[project.scripts]
megax = "megax.cli:main"
megax-gui = "megax.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
